# Default values for orange-bank Helm chart.

replicaCount: 2

image:
  repository: orange-bank/app
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# OpenShift Route
route:
  enabled: true
  host: ""  # Auto-generated by OpenShift if left empty
  path: /
  tls:
    enabled: true
    termination: edge          # edge | reencrypt | passthrough
    insecureEdgeTerminationPolicy: Redirect
  annotations: {}

# Kubernetes Ingress (non-OpenShift environments)
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: orange-bank.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}

tolerations: []

affinity: {}

env: []
  # - name: NODE_ENV
  #   value: production

envFrom: []
  # - secretRef:
  #     name: orange-bank-secrets
